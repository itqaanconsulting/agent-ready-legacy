# Local demo: the gateway, its audit database, and the simulated legacy case system.
# Development only: tokens are signed with a shared dev secret instead of an identity provider.
services:
  zaaksysteem:
    image: wiremock/wiremock:3.13.2
    command: ["--port", "8089", "--disable-banner"]
    volumes:
      - ./legacy-simulator:/home/wiremock:ro

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 2s
      retries: 30

  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/gateway
      DATABASE_USERNAME: gateway
      DATABASE_PASSWORD: gateway
      ZAAKSYSTEEM_URL: http://zaaksysteem:8089/zaaksysteem/ZaakService
      GATEWAY_SECURITY_DEV_JWT_SECRET: dev-only-secret-change-me-at-least-32-bytes
    depends_on:
      database:
        condition: service_healthy
      zaaksysteem:
        condition: service_started
