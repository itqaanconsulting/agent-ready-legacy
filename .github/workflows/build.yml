name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (Spring Boot also writes a CycloneDX SBOM)
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Scan the SBOM for known vulnerabilities
        uses: anchore/scan-action@v6
        with:
          sbom: target/classes/META-INF/sbom/application.cdx.json
          fail-build: true
          severity-cutoff: high
          output-format: table
      - uses: actions/upload-artifact@v7
        with:
          name: gateway
          path: |
            target/agent-ready-legacy-*.jar
            target/classes/META-INF/sbom/application.cdx.json

  demo:
    # Runs the full demo: docker compose (gateway, PostgreSQL, legacy simulator) and the Python agent.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gateway
          path: target
      - name: Start the stack
        run: docker compose up --detach --build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run the demo agent
        working-directory: demo-agent
        run: |
          pip install --quiet -r requirements.txt
          python demo_agent.py
      - name: Gateway logs
        if: failure()
        run: docker compose logs gateway
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
